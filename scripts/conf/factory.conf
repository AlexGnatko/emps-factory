# /etc/emps-factory/factory.conf
#
# Settings for the EMPS Factory backup and maintenance scripts.
#
# Every option has a built-in default, so the scripts also work with an empty
# or missing file. Lines starting with "# Keyword" show an option at its
# default value or as an example; the few uncommented lines are the settings
# chosen for this installation.
#
# Syntax (sshd style):
#   Keyword value          or     Keyword = value
#   * keywords are case-insensitive and ignore underscores:
#     KeepPrevious = keep_previous = KEEP_PREVIOUS
#   * "#" starts a comment (at the start of a line, or after whitespace)
#   * a repeated keyword adds to a list (MysqlExcludeDb, ...); for single
#     values the LAST one wins, so later files override earlier ones
#   * "Reset Keyword" empties a list collected so far
#   * "Target NAME" starts a backup target; its options follow until the next
#     Target, Include or the end of the file. Put global options BEFORE targets.
#   * the file must be owned by root and not writable by group/others
#
# Do not edit this file for local changes if you can avoid it: drop files into
# /etc/emps-factory/conf.d/ instead (see the Include at the bottom). Use numeric
# prefixes to control the order: 00-base.conf, 10-targets.conf, 90-local.conf.
# Only *.conf files are read, so "10-s3.conf.off" is a disabled file.
#
# After changing DumpPeriod, FilesPeriod or the Cron* options, run:
#   emps-factory-cron.sh --install

###############################################################################
# General
###############################################################################

# Where the local copies of backups are kept (<BackupRoot>/mysql/<timestamp>/)
# BackupRoot /srv/backups

# rclone configuration used by all "Type rclone" targets
# RcloneConfig /etc/emps-factory/rclone.conf

###############################################################################
# MySQL dumps (mysql-dump-all.sh)
###############################################################################

# How often a dump is taken: <number>h, <number>d or <number>w
#   8h, 12h, 1d, 1w ...      Built-in default: 1d
DumpPeriod 12h

# How many dumps to keep (the newest included). One "unit" is one DumpPeriod:
# with DumpPeriod 12h, KeepPrevious 28 keeps 14 days; with 1d, 14 keeps 14 days;
# with 1w, 4 keeps four weeks. 0 = never delete. Built-in default: 14
KeepPrevious 14

# Connection: root over the unix socket (auth_socket), no password. To use
# another account, point MysqlDefaultsFile to a my.cnf-style file with a [client]
# section (it replaces the socket connection).
# MysqlUser root
# MysqlDefaultsFile /etc/emps-factory/mysql-client.cnf

# Databases to skip (shell patterns); information_schema, performance_schema
# and sys are always skipped.
# MysqlExcludeDb test
# MysqlExcludeDb scratch_*

# Back up only these databases (shell patterns); empty = all
# MysqlOnlyDb shop_*

# Also dump the "mysql" system database (accounts and grants). Default: no
# MysqlIncludeGrants no

# Rewrite utf8mb4_0900_* collations so dumps load into MySQL 5.7 / MariaDB.
# Default: no
# MysqlLegacyCollation no

# MysqlLogFile /var/log/mysql-dump-all.log

###############################################################################
# File backups (files-backup.sh)
###############################################################################

# What goes into the archive is NOT set here but in /etc/emps-factory/backup.d/:
#   00-default.include / 00-default.exclude   shipped, overwritten on upgrade
#   NN-name.include / NN-name.exclude         your own (e.g. 50-local.include)
# *.include: one absolute path per line, "- /path" removes an earlier entry.
# *.exclude: tar wildcard patterns. Files are read in name order; a file that
# does not end in .include/.exclude (e.g. 50-x.include.off) is ignored.
# BackupDir /etc/emps-factory/backup.d

# Ignore the shipped 00-default.* files (then list everything yourself)
# BackupDefaults yes

# Archive format: zstd (.tar.zst, fast and small), gzip (.tar.gz) or none (.tar)
# BackupCompression zstd
# BackupCompressionLevel 3        # default: 3 for zstd, 6 for gzip

# Skip any directory that contains this file ("" disables)
# BackupExcludeTag .nobackup

# Do not descend into other file systems (mounted disks)
# BackupOneFileSystem no

# How often and how many: same rules as DumpPeriod / KeepPrevious
# (built-in defaults: 1d and 7). 3d and 5 = a backup every 3 days, 15 days kept.
FilesPeriod 3d
FilesKeepPrevious 5

# yes: write the archive to <BackupRoot>/files/ first, then copy it to targets.
# no: stream tar straight to ONE rclone target without a local copy (saves disk
# space on big servers; needs exactly one enabled rclone target for files)
# FilesLocalCopy yes

# FilesLogFile /var/log/files-backup.log

###############################################################################
# Cron schedule (used only by emps-factory-cron.sh)
###############################################################################

# Which jobs to put into /etc/cron.d/emps-factory
# CronMysql yes
# CronFiles yes

# Minute and first hour of the day for the jobs. With DumpPeriod 12h and
# CronStartHour 3 the MySQL dump runs at 03:xx and 15:xx; the file backup has
# its own pair so the two do not start together.
# CronOffsetMinute 17
# CronStartHour 3
# CronFilesOffsetMinute 47
# CronFilesStartHour 4

# Where cron mails script errors (optional)
# CronMailTo admin@example.com

###############################################################################
# Backup targets: where finished dumps are copied in addition to the local
# copy in BackupRoot. Each target takes the same <kind>/<timestamp> layout.
#
#   Type          local   copy to another directory (a mounted disk, NFS...)
#                 rclone  copy with rclone: S3, SFTP, B2, Google Drive...
#   Path          (local)  base directory
#   Remote        (rclone) remote:bucket/path as known to rclone.conf
#   KeepPrevious  how many MySQL dumps to keep on this target (default: global one)
#   FilesKeepPrevious  the same for file backups
#   Kinds         which backups go here: mysql, files (default: both)
#   Enabled       yes|no
#   RcloneFlags   extra rclone flags, e.g. --s3-chunk-size 32M
#
# %h in Path and Remote is replaced with the host name.
###############################################################################

# Target nas
#     Type          local
#     Path          /mnt/nas/backups/%h
#     KeepPrevious  60
#
# Target adman
#     Type          rclone
#     Remote        adman:my-bucket/%h
#     KeepPrevious  90
#     FilesKeepPrevious 30
#     RcloneFlags   --s3-chunk-size 32M --s3-upload-concurrency 4

###############################################################################
# Local overrides. Keep this line LAST so that conf.d/ overrides the above.
###############################################################################

Include /etc/emps-factory/conf.d/*.conf
